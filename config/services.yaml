# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    photos_directory: '%kernel.project_dir%/public/uploads/photos'
    app.mailer_from: '%env(MAILER_FROM)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Makes classes in src/ available as services
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Explicit controller registration (from reservation branch)
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # Your email service (from HEAD)
    App\Service\AuthEmailService:
        arguments:
            $fromAddress: '%app.mailer_from%'

    # Database service (from reservation branch)
    App\Service\DatabaseConnection:
        arguments:
            $host: '%env(DB_HOST)%'
            $port: '%env(int:DB_PORT)%'
            $database: '%env(DB_NAME)%'
            $username: '%env(DB_USER)%'
            $password: '%env(DB_PASSWORD)%'