parameters:
    uploads_directory: '%kernel.project_dir%/public/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\MailjetService:
        arguments:
            $apiKey:    '%env(MAILJET_API_KEY)%'
            $apiSecret: '%env(MAILJET_API_SECRET)%'